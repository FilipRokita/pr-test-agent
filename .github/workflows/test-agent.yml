name: test-agent

# Proposes verified unit tests for pull requests from this repository.
# Jobs are separated by what they may hold: the generate job has the model credential and a read-only token,
# the verify job has neither, the publish job has a write token and never runs the pull request's tests.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AGENT_RUNNER: .github/test-agent/runner
  AGENT_ARTIFACTS: test-agent-artifacts

jobs:
  context:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'test-agent/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.context.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the runner
        run: |
          python -m venv "$AGENT_RUNNER/.venv"
          "$AGENT_RUNNER/.venv/bin/pip" install --quiet -r "$AGENT_RUNNER/requirements.txt"
      - name: Classify the pull request
        id: context
        run: PYTHONPATH="$AGENT_RUNNER" "$AGENT_RUNNER/.venv/bin/python" -m test_agent context --artifacts "$AGENT_ARTIFACTS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: context
          path: ${{ env.AGENT_ARTIFACTS }}/context.json
          if-no-files-found: error

  generate:
    needs: context
    if: needs.context.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: test-agent
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dependencies (no secrets in this step)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --quiet -r backend/requirements.txt pytest-randomly
          (cd frontend && npm ci --ignore-scripts --no-audit --no-fund)
          python -m venv "$AGENT_RUNNER/.venv"
          "$AGENT_RUNNER/.venv/bin/pip" install --quiet -r "$AGENT_RUNNER/requirements.txt"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: context
          path: ${{ env.AGENT_ARTIFACTS }}
      - name: Prepare the sandbox
        run: bash "$AGENT_RUNNER/scripts/prepare_sandbox.sh"
      - name: Run the agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_AGENT_MODEL: ${{ vars.TEST_AGENT_MODEL }}
        run: PYTHONPATH="$AGENT_RUNNER" "$AGENT_RUNNER/.venv/bin/python" -m test_agent generate --artifacts "$AGENT_ARTIFACTS"
      - name: Collect the proposed tests as a patch (no secrets in this step)
        if: ${{ !cancelled() }}
        run: PYTHONPATH="$AGENT_RUNNER" "$AGENT_RUNNER/.venv/bin/python" -m test_agent patch --artifacts "$AGENT_ARTIFACTS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: generated
          path: |
            ${{ env.AGENT_ARTIFACTS }}/agent-result.json
            ${{ env.AGENT_ARTIFACTS }}/agent.patch
          if-no-files-found: warn

  verify:
    needs: [context, generate]
    if: needs.generate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --quiet -r backend/requirements.txt pytest-randomly
          (cd frontend && npm ci --ignore-scripts --no-audit --no-fund)
          python -m venv "$AGENT_RUNNER/.venv"
          "$AGENT_RUNNER/.venv/bin/pip" install --quiet -r "$AGENT_RUNNER/requirements.txt"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*"
          merge-multiple: true
          path: ${{ env.AGENT_ARTIFACTS }}
      - name: Prepare the sandbox
        run: bash "$AGENT_RUNNER/scripts/prepare_sandbox.sh"
      - name: Verify the proposed tests
        run: PYTHONPATH="$AGENT_RUNNER" "$AGENT_RUNNER/.venv/bin/python" -m test_agent verify --artifacts "$AGENT_ARTIFACTS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: verification
          path: ${{ env.AGENT_ARTIFACTS }}/verification.json
          if-no-files-found: warn

  publish:
    needs: [context, generate, verify]
    if: ${{ !cancelled() && needs.context.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The runner that writes to the pull request comes from the base branch when it exists there.
      # Until this workflow has been merged, the base has no runner and the head is used instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tool-base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tool-head
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*"
          merge-multiple: true
          path: ${{ env.AGENT_ARTIFACTS }}
      - name: Publish the result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "tool-base/$AGENT_RUNNER/requirements.txt" ]; then tool=tool-base; else tool=tool-head; fi
          python -m venv /tmp/runner-venv
          /tmp/runner-venv/bin/pip install --quiet -r "$tool/$AGENT_RUNNER/requirements.txt"
          PYTHONPATH="$tool/$AGENT_RUNNER" /tmp/runner-venv/bin/python -m test_agent publish \
            --root "$tool" --artifacts "$AGENT_ARTIFACTS"
